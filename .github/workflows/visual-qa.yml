name: Visual QA

on:
  workflow_dispatch:
    inputs:
      url:
        description: Live URL to screenshot
        required: false
        default: https://c3po-ravejedi.github.io/bultman-advisory-client-portal/
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'qa/**'
      - '.github/workflows/visual-qa.yml'

jobs:
  screenshot:
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: GITHUB_PAGES=true pnpm run build
      - run: npx --yes playwright install --with-deps chromium
      - name: Capture live screenshots
        env:
          QA_URL: ${{ github.event.inputs.url || 'https://c3po-ravejedi.github.io/bultman-advisory-client-portal/' }}
        run: node qa/capture-live-screenshots.mjs "$QA_URL" qa/screenshots
      - name: LLM visual evaluation of screenshot artifacts
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VISUAL_QA_MODEL: gpt-4.1
        run: node qa/llm-evaluate-screenshots.mjs qa/screenshots/desktop-1440.png qa/screenshots/mobile-390.png qa/screenshots/llm-visual-eval.md
      - name: Record missing LLM visual evaluation gate
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: node qa/llm-evaluate-screenshots.mjs qa/screenshots/desktop-1440.png qa/screenshots/mobile-390.png qa/screenshots/llm-visual-eval.md
      - uses: actions/upload-artifact@v4
        with:
          name: bultman-live-screenshots
          path: qa/screenshots
