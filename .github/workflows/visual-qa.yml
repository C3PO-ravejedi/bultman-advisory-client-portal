name: Visual QA

on:
  workflow_dispatch:
    inputs:
      url:
        description: Live URL to screenshot
        required: false
        default: https://c3po-ravejedi.github.io/bultman-advisory-client-portal/
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'qa/**'
      - '.github/workflows/visual-qa.yml'

jobs:
  screenshot:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: GITHUB_PAGES=true pnpm run build
      - name: Run Playwright functional QA
        run: |
          PLAYWRIGHT_REQUIRE_PATH=$(pnpm dlx -p playwright@latest node -e "console.log(require.resolve('playwright'))")
          pnpm dlx playwright@latest install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/bultman-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/bultman-advisory-client-portal/ >/dev/null; then
              break
            fi
            sleep 1
          done
          PLAYWRIGHT_REQUIRE_PATH="$PLAYWRIGHT_REQUIRE_PATH" node qa/functional-qa.mjs http://127.0.0.1:4173/bultman-advisory-client-portal/ qa/screenshots/functional-qa.json
      - run: pnpm dlx playwright@latest install --with-deps chromium
      - name: Capture live screenshots
        env:
          QA_URL: ${{ github.event.inputs.url || 'https://c3po-ravejedi.github.io/bultman-advisory-client-portal/' }}
        run: |
          mkdir -p qa/screenshots
          npx --yes playwright screenshot --browser=chromium --wait-for-timeout=5000 --viewport-size=1440,1800 "$QA_URL?visualQa=${GITHUB_RUN_ID}-desktop" qa/screenshots/desktop-1440.png
          npx --yes playwright screenshot --browser=chromium --wait-for-timeout=5000 --viewport-size=390,844 "$QA_URL?visualQa=${GITHUB_RUN_ID}-mobile" qa/screenshots/mobile-390.png
          cat > qa/screenshots/README.md <<EOF2
          # Live Visual QA Screenshots

          URL: $QA_URL
          Captured: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Files:
          - desktop-1440.png
          - mobile-390.png
          EOF2
      - name: LLM visual evaluation of screenshot artifacts
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VISUAL_QA_MODEL: gpt-4.1
        run: node qa/llm-evaluate-screenshots.mjs qa/screenshots/desktop-1440.png qa/screenshots/mobile-390.png qa/screenshots/llm-visual-eval.md
      - name: Record missing LLM visual evaluation gate
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: node qa/llm-evaluate-screenshots.mjs qa/screenshots/desktop-1440.png qa/screenshots/mobile-390.png qa/screenshots/llm-visual-eval.md
      - uses: actions/upload-artifact@v4
        with:
          name: bultman-live-screenshots
          path: qa/screenshots
